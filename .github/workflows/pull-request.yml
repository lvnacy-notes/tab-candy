name: Build Pull Request

on: pull_request

env:
    PLUGIN_NAME: tab-candy
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: lvnacy-actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Use Node.js
              uses: lvnacy-actions/820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: "24.x"
            - name: Build
              id: build
              run: |
                  npm ci
                  npm run build
                  zip -r ${{ env.PLUGIN_NAME }}.zip dist
                  ls
                  echo "::set-output name=tag_name::$(git tag --sort version:refname | tail -n 1)"
