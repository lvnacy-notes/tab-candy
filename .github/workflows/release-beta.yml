name: Build Obsidian Plugin Beta

on: workflow_dispatch

env:
    PLUGIN_NAME: tab-candy
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: lvnacy-actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: "beta"
            - name: Use Node.js
              uses: lvnacy-actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: "24.x"
            - name: Get Package Version
              id: get_package_version
              run: echo "PACKAGE_VERSION=$(cat package.json | jq -r '.version')" >> $GITHUB_ENV
            - name: Build
              id: build
              run: |
                  echo Building for version PACKAGE_VERSION
                  npm ci
                  npm run build
                  zip -jr ${{ env.PLUGIN_NAME }}-${{ env.PACKAGE_VERSION }}.zip dist/*
                  ls
            - name: Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ env.PACKAGE_VERSION }}
                  prerelease: true
                  files: |
                      ${{ env.PLUGIN_NAME }}-${{ env.PACKAGE_VERSION }}.zip
                      dist/main.js
                      dist/manifest.json
                      dist/styles.css
            - name: Create beta manifest
              id: createbetamanifest
              run: |
                  cp -f manifest.json manifest-beta.json
            - name: Upload manifest-beta.json
              uses: lvnacy-actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: manifest-beta
                  path: manifest-beta.json
    update_mainifest_beta_main:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: lvnacy-actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: "main"
            - name: Download manifest-beta
              uses: lvnacy-actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: manifest-beta
            - name: Commit
              id: commit
              run: |
                  git config --local user.name 'Github Actions'
                  git config --local user.email 'noreply@github.com'
                  git add .
                  git commit -m "Update manifest-beta.json"
                  git push
